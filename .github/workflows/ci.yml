name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (latest 10.0, preview channel)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Format check
        run: dotnet format --verify-no-changes

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Personal path scan
        run: |
          set -e
          # Fail if tracked files contain personal absolute paths.
          # Exclude the scanner files themselves (they contain the patterns).
          if git grep -nIE '(/Users/|/home/[A-Za-z]|C:\\Users)' -- \
              ':(exclude).github/workflows/ci.yml' \
              ':(exclude).githooks/pre-commit'; then
            echo "::error::Personal absolute path found in a tracked file."
            exit 1
          fi
          echo "No personal paths found."
