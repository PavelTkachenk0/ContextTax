  <text x="600" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#1A1A18" letter-spacing="-2">Context<tspan fill="#CC785C">Tax</tspan></text>
  <rect x="564" y="160" width="72" height="3" fill="#CC785C"/>
  <text x="600" y="206" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-style="italic" fill="#57534B">Measure the context-window tax an MCP server charges your agent.</text>
