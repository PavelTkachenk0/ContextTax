<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="contexttax measure github — count_tokens 10,928 tokens vs o200k estimate 8,616, a 2,312-token gap Claude charges that the proxy misses">
